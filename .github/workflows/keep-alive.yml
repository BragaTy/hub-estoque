name: Manter Supabase ativo

# O plano gratuito do Supabase pausa o projeto após ~7 dias sem atividade.
# Este job faz uma consulta leve a cada 3 dias para evitar a pausa.

on:
  schedule:
    - cron: '0 12 */3 * *'   # a cada 3 dias, às 12:00 UTC
  workflow_dispatch:          # permite rodar manualmente na aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/produtos?select=codigo&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $status"
          cat response.json
          test "$status" = "200"
